<!DOCTYPE html>
<html lang="en" data-theme="her">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fashionista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff; --ink:#000; --soft:#f6dde6; --accent:#e27ca0; --accent-2:#f9eaf0;
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Jost",system-ui,sans-serif;
}
[data-theme="her"]{--soft:#f6dde6;--accent:#e27ca0;--accent-2:#fbeef3}
[data-theme="him"]{--soft:#d7e5f4;--accent:#4f86c6;--accent-2:#eef4fb}
[data-theme="neutral"]{--soft:#efefef;--accent:#000;--accent-2:#f7f7f7}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;
  -webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0)}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 5vw;border-bottom:1px solid #0001}
.logo{font-family:var(--serif);font-size:1.7rem;letter-spacing:.14em;font-weight:600}
.switch{display:flex;gap:6px;background:var(--accent-2);padding:5px;border-radius:99px;transition:background .6s}
.switch button{font:inherit;font-size:.85rem;border:0;background:none;padding:8px 18px;border-radius:99px;cursor:pointer;color:var(--ink);transition:background .5s,color .5s}
.switch button[aria-pressed="true"]{background:var(--accent);color:#fff}
.switch button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;min-height:calc(100vh - 140px)}
.copy{padding:8vh 5vw;display:flex;flex-direction:column;justify-content:center;gap:28px}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(3rem,8vw,7rem);line-height:.95;letter-spacing:-.01em}
h1 em{font-style:italic}
.copy p{max-width:44ch;line-height:1.7;font-size:1.05rem}
.moods{display:flex;flex-wrap:wrap;gap:10px}
.moods button{font:inherit;border:1px solid var(--ink);background:none;padding:10px 20px;border-radius:99px;cursor:pointer;transition:background .4s,color .4s,transform .4s}
.moods button:hover,.moods button[aria-pressed="true"]{background:var(--ink);color:#fff}
.moods button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cta{align-self:flex-start;background:var(--ink);color:#fff;border:0;padding:16px 34px;border-radius:99px;font:inherit;font-weight:500;cursor:pointer}
.cta:hover{background:var(--accent)}
.stage{position:relative;background:var(--soft);overflow:hidden;transition:background .8s ease}
.orb{position:absolute;border-radius:50%;background:var(--accent);opacity:.35;filter:blur(2px);transition:background .8s}
.o1{width:60%;aspect-ratio:1;left:-10%;top:10%;animation:float 9s ease-in-out infinite}
.o2{width:40%;aspect-ratio:1;right:8%;bottom:8%;animation:float 12s ease-in-out infinite reverse}
.card{position:absolute;inset:18% 16%;background:#fff;border-radius:200px 200px 24px 24px;display:flex;align-items:flex-end;justify-content:center;padding:28px;text-align:center;box-shadow:0 30px 60px #0001}
.card span{font-family:var(--serif);font-size:1.5rem;font-style:italic}
@keyframes float{50%{transform:translateY(-24px) scale(1.04)}}
@media (max-width:800px){.hero{grid-template-columns:1fr}.stage{min-height:50vh}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo">FASHIONISTA</div>
  <div class="switch" role="group" aria-label="Choose your section">
    <button data-t="her" aria-pressed="true">Her</button>
    <button data-t="him" aria-pressed="false">Him</button>
    <button data-t="neutral" aria-pressed="false">Everyone</button>
  </div>
</header>
<main class="hero">
  <section class="copy">
    <h1 id="headline">Dress the <em>mood</em> you're in.</h1>
    <p>Plan outfits from your own closet, try them on a 3D model built to your measurements, and get fit advice and trusted stores to buy from.</p>
    <div class="moods" role="group" aria-label="Pick a mood">
      <button aria-pressed="false">Confident</button>
      <button aria-pressed="false">Cozy</button>
      <button aria-pressed="false">Romantic</button>
      <button aria-pressed="false">Black tie</button>
    </div>
    <button class="cta">Start your closet</button>
  </section>
  <section class="stage" aria-hidden="true">
    <div class="orb o1"></div><div class="orb o2"></div>
    <div class="card"><span id="cardtext">Your look, in 3D</span></div>
  </section>
</main>
<script>
const root=document.documentElement;
document.querySelectorAll('.switch button').forEach(b=>b.addEventListener('click',()=>{
  root.dataset.theme=b.dataset.t;
  document.querySelectorAll('.switch button').forEach(x=>x.setAttribute('aria-pressed',x===b));
}));
const lines={Confident:'Walk in like you own it',Cozy:'Soft layers, no rush',Romantic:'Dinner for two',"Black tie":'Gown season'};
document.querySelectorAll('.moods button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.moods button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  document.getElementById('cardtext').textContent=lines[b.textContent];
}));
</script>
</body>
</html>
